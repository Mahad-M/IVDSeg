[project]
name = "ivdseg"
version = "0.1.0"
description = "Research pipeline for IVD segmentation on IVDM3Seg"
requires-python = ">=3.12,<3.13"
dependencies = [
    "monai==1.5.1",
    "nibabel>=5.4.2",
    "nnunetv2>=2.8.1",
    "rfdetr[augment,train,visual]==1.9.1",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[dependency-groups]
dev = [
    "cairosvg>=2.9.0",
    "matplotlib>=3.11.1",
    "modal>=1.5.4",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
